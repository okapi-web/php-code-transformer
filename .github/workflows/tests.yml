name: PHP Tests

on:
  push:
    branches: [ "master" ]
  pull_request_review:
    types: [ submitted, edited ]

  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Mago formatter, linter and analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install development dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Run formatter, linter and analyzer without a baseline
        run: composer check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  run:
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        operating-system: [ ubuntu-latest ]
        php-version: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]

    name: PHP ${{ matrix.php-version }} tests on ${{ matrix.operating-system }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install PHP
        id: php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug

      - name: Check PHP version
        run: php -v

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPUnit Tests
        run: vendor/bin/phpunit --testsuite=Tests --coverage-clover ./tests/coverage.xml --display-notices

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./tests/coverage.xml
          flags: os-${{ matrix.operating-system }}_php-${{ matrix.php-version }}
          verbose: true
